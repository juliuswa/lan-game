<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Rush</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 12px 0 4px; }
  #join { margin-top: 40px; display: flex; gap: 8px; }
  input, button { font-size: 18px; padding: 8px 12px; border-radius: 6px; border: none; }
  button { background: #4363d8; color: white; cursor: pointer; }
  #game { display: none; gap: 16px; align-items: flex-start; }
  canvas { background: #1d1d1d; border: 2px solid #333; border-radius: 8px; max-width: 95vw; }
  #board { min-width: 180px; }
  #board li { list-style: none; margin: 4px 0; font-size: 18px; }
  #board ul { padding: 0; }
</style>
</head>
<body>
<h1>Coin Rush</h1>
<p>Move with WASD / arrow keys. Space to dash and shove players — recharges after 5 coins. First to the target wins.</p>
<form id="join">
  <input id="name" placeholder="Your name" maxlength="16" autofocus required>
  <button>Join</button>
</form>
<div id="game">
  <canvas id="canvas" width="800" height="600"></canvas>
  <div id="board"><h3>Scores</h3><ul id="scores"></ul></div>
</div>
<script src="/shared.js"></script>
<script>
const { CONFIG, applyInput } = window.Shared;
const INTERPOLATION_DELAY_MS = 50;
const SNAPSHOT_HISTORY_MS = 1000;
const STEP_MS = CONFIG.stepSeconds * 1000;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const scoresList = document.getElementById("scores");
const keyMap = { ArrowUp: "up", w: "up", ArrowDown: "down", s: "down", ArrowLeft: "left", a: "left", ArrowRight: "right", d: "right" };
const keys = { up: false, down: false, left: false, right: false };

let socket = null;
let playerId = null;
let latestState = null;
let predicted = null;
let pendingInputs = [];
let nextSeq = 1;
let dashRequested = false;
let snapshots = [];
let lastScoresKey = "";
let accumulator = 0;
let lastFrameTime = performance.now();

const isMoving = () => keys.up || keys.down || keys.left || keys.right;

const setKey = (event, pressed) => {
  if (event.code === "Space" && playerId) {
    event.preventDefault();
    if (pressed && !event.repeat) dashRequested = true;
    return;
  }
  const direction = keyMap[event.key.length === 1 ? event.key.toLowerCase() : event.key];
  if (!direction || !playerId) return;
  event.preventDefault();
  keys[direction] = pressed;
};

addEventListener("keydown", (e) => setKey(e, true));
addEventListener("keyup", (e) => setKey(e, false));
addEventListener("blur", () => Object.keys(keys).forEach((key) => (keys[key] = false)));

const reconcile = (state) => {
  const me = state.players.find((player) => player.id === playerId);
  if (!me) return;
  pendingInputs = pendingInputs.filter((input) => input.seq > me.ack);
  const { x, y, dashTicks, dashX, dashY, faceX, faceY, dashCharge } = me;
  predicted = { x, y, dashTicks, dashX, dashY, faceX, faceY, dashCharge };
  if (!state.winner) for (const input of pendingInputs) applyInput(predicted, input.keys);
};

const simulateStep = () => {
  if (!predicted || latestState.winner) {
    dashRequested = false;
    return;
  }
  if (!isMoving() && !dashRequested && predicted.dashTicks === 0) return;
  const input = { seq: nextSeq++, keys: { ...keys, dash: dashRequested } };
  dashRequested = false;
  pendingInputs.push(input);
  applyInput(predicted, input.keys);
  socket.send(JSON.stringify({ type: "input", ...input }));
};

const interpolatedPosition = (id, renderTime) => {
  for (let i = snapshots.length - 1; i > 0; i--) {
    const older = snapshots[i - 1];
    if (older.time > renderTime) continue;
    const newer = snapshots[i];
    const from = older.players.get(id);
    const to = newer.players.get(id);
    if (!from || !to) return to || from;
    const t = Math.min((renderTime - older.time) / (newer.time - older.time || 1), 1);
    return { x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t };
  }
  return snapshots[0] && snapshots[0].players.get(id);
};

const drawCircle = (x, y, radius, color) => {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
};

const drawDashCharge = (x, y, charge) => {
  const ready = charge >= CONFIG.dashCoinCost;
  ctx.beginPath();
  ctx.arc(x, y, CONFIG.playerRadius + 6, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * charge) / CONFIG.dashCoinCost);
  ctx.lineWidth = 3;
  ctx.strokeStyle = ready ? "#46f0f0" : "rgba(70,240,240,0.4)";
  ctx.stroke();
};

const render = (now) => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const coin of latestState.coins) drawCircle(coin.x, coin.y, CONFIG.coinRadius, "gold");
  for (const player of latestState.players) {
    const isMe = player.id === playerId;
    const { x, y } = (isMe ? predicted : interpolatedPosition(player.id, now - INTERPOLATION_DELAY_MS)) || player;
    drawCircle(x, y, CONFIG.playerRadius, player.color);
    if (isMe) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = "white";
      ctx.stroke();
      drawDashCharge(x, y, predicted.dashCharge);
    }
    ctx.fillStyle = "#eee";
    ctx.font = "14px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(player.name, x, y - CONFIG.playerRadius - 6);
  }
  if (latestState.winner) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "white";
    ctx.font = "bold 48px system-ui";
    ctx.fillText(`${latestState.winner} wins!`, canvas.width / 2, canvas.height / 2);
  }
};

const renderScores = (state) => {
  const ranked = [...state.players].sort((a, b) => b.score - a.score);
  const scoresKey = ranked.map((player) => `${player.id}:${player.score}`).join(",");
  if (scoresKey === lastScoresKey) return;
  lastScoresKey = scoresKey;
  scoresList.innerHTML = "";
  for (const player of ranked) {
    const item = document.createElement("li");
    item.textContent = `${player.name}: ${player.score} / ${CONFIG.winScore}`;
    item.style.color = player.color;
    scoresList.appendChild(item);
  }
};

const receiveState = (state) => {
  const now = performance.now();
  latestState = state;
  snapshots.push({ time: now, players: new Map(state.players.map((player) => [player.id, player])) });
  snapshots = snapshots.filter((snapshot) => now - snapshot.time < SNAPSHOT_HISTORY_MS);
  reconcile(state);
  renderScores(state);
};

const frame = (now) => {
  accumulator += Math.min(now - lastFrameTime, 250);
  lastFrameTime = now;
  while (accumulator >= STEP_MS) {
    if (latestState) simulateStep();
    accumulator -= STEP_MS;
  }
  if (latestState) render(now);
  requestAnimationFrame(frame);
};

document.getElementById("join").addEventListener("submit", (event) => {
  event.preventDefault();
  const name = document.getElementById("name").value;
  socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`);
  socket.onopen = () => socket.send(JSON.stringify({ type: "join", name }));
  socket.onmessage = (message) => {
    const data = JSON.parse(message.data);
    if (data.type === "welcome") {
      playerId = data.id;
      document.getElementById("join").style.display = "none";
      document.getElementById("game").style.display = "flex";
      requestAnimationFrame(frame);
    } else if (data.type === "state") {
      receiveState(data);
    }
  };
  socket.onclose = () => alert("Disconnected from server. Reload to rejoin.");
});
</script>
</body>
</html>
